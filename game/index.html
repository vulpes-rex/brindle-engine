<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Brindlebrook</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1218;--panel:#16222b;--line:#2b3e4a;--ink:#eef2ea;--dim:#9db0ac;--leaf:#8cc05a;--glow:#ffe896;--box:#1a2440;--boxline:#cfd8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Pixelify Sans",ui-monospace,Menlo,monospace;overscroll-behavior:none}
#app{width:min(calc(100vw - 16px),calc(100vh - 215px),760px);min-width:260px;margin:0 auto;padding:10px 0 14px;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{margin:0;font-size:22px;font-weight:600;color:var(--glow)}
header span{font-size:13px;color:var(--dim)}
#stage{position:relative;width:100%;aspect-ratio:1/1;border:2px solid var(--line);overflow:hidden;background:#101a22;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges}
#cv.smooth{image-rendering:auto}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(9,14,20,.9);font-size:17px;line-height:1.4}
#load.off{display:none}
#dlg{position:absolute;left:8px;right:8px;bottom:8px;padding:10px 12px 14px;min-height:84px;font-size:16px;line-height:1.35;cursor:pointer}
#dlg.off{display:none}
#who{color:var(--glow);font-weight:600;margin-bottom:3px;min-height:0}
#say{margin:0;white-space:pre-wrap}
#more{position:absolute;right:10px;bottom:3px;font-size:12px;color:var(--boxline);animation:bob 0.9s steps(2) infinite}
#dlg.ask{cursor:default}
#dlg.ask #more{display:none}
#cho{position:absolute;right:-2px;bottom:100%;margin-bottom:10px;min-width:48%;max-width:85%;padding:4px 6px;display:flex;flex-direction:column}
#cho.off{display:none}
@keyframes bob{50%{transform:translateY(3px)}}
#cred{margin:2px 0 0;font-size:11px;line-height:1.3;color:#6f8582}
#hint{margin:0;min-height:2.6em;font-size:14px;line-height:1.3;color:var(--dim)}
#opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:6px;min-height:46px;cursor:pointer}
button.on{border-color:var(--leaf);color:var(--glow)}
button:active{background:#20323d}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fade{position:absolute;inset:0;background:#05070c;opacity:0;pointer-events:none;transition:opacity .3s steps(6)}
#fade.on{opacity:1}
#toast{position:absolute;right:8px;top:8px;padding:3px 8px;font-size:12px;color:var(--glow);background:rgba(10,15,32,.85);border:1px solid var(--boxline);opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;background:rgba(9,14,20,.92);font-size:17px;line-height:1.4}
#title.off{display:none}
#title p{margin:0;color:var(--ink);font-size:17px}
#tbtn{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#tbtn button{min-width:120px;font-size:16px}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--glow);outline-offset:1px}
.ebar{position:absolute;width:54px;height:7px;margin:-4px 0 0 -27px;background:#0a1016;border:1px solid #cfd8ff}
.ebar i{display:block;height:100%;background:#e0584c}
.enm{position:absolute;transform:translate(-50%,-190%);font-size:11px;color:#eef;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000;white-space:nowrap}
.num{position:absolute;transform:translate(-50%,-50%);font-size:22px;font-weight:600;color:#fff;letter-spacing:2px;text-shadow:1px 0 0 #1a2050,-1px 0 0 #1a2050,0 1px 0 #1a2050,0 -1px 0 #1a2050,1px 1px 0 #1a2050,-1px 1px 0 #1a2050,1px -1px 0 #1a2050,-1px -1px 0 #1a2050,0 3px 0 #0a0f20;animation:pop 1.1s forwards;white-space:nowrap}
.num.heal{color:#8ff58a}
.num.txt{font-size:15px;color:var(--glow)}
/* numbers spring up, land with a little bounce, sit, and go (as in Golden Sun) */
@keyframes pop{0%{margin-top:6px;opacity:0;scale:.6}8%{margin-top:-22px;opacity:1;scale:1.15}20%{margin-top:0;scale:1}28%{margin-top:-7px}36%{margin-top:0}80%{opacity:1}100%{margin-top:-4px;opacity:0}}
.cur{position:absolute;transform:translate(-50%,-100%);color:var(--glow);font-size:14px;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000;animation:bob .7s steps(2) infinite}
/* battle windows, after Golden Sun: blue, bright-edged, rounded */
.gs{background:linear-gradient(180deg,#3452d4 0%,#1d2f96 40%,#101c66 100%);border:2px solid #e2e8ff;border-radius:5px;box-shadow:0 0 0 2px #0a0f2c,inset 0 0 0 1px rgba(150,176,255,.55);color:#fff;text-shadow:1px 1px 0 #0a0f30}
#bp{display:flex;flex-direction:column;gap:8px}
#bp.off{display:none}
#bmsg{min-height:3.1em;padding:7px 10px;font-size:15px;line-height:1.35}
#bparty{position:absolute;top:6px;right:6px;display:flex;gap:4px;pointer-events:none}
#bparty:empty{display:none}
.st{width:clamp(84px,22vw,132px);padding:3px 6px 5px;background:linear-gradient(180deg,rgba(52,82,212,.92) 0%,rgba(29,47,150,.92) 45%,rgba(16,28,102,.92) 100%);font-size:12px;line-height:1.15}
.st b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.act{border-color:var(--glow);box-shadow:0 0 0 2px #0a0f2c,0 0 8px 1px rgba(255,232,150,.7),inset 0 0 0 1px rgba(255,232,150,.5)}
.st.low .sv:first-of-type{color:var(--glow)}
.st.ko{filter:saturate(.4)}
.st.ko b,.st.ko .sv{color:#ff9a9a}
.sv{display:flex;justify-content:space-between;margin-top:1px}
.sv i{font-style:normal;color:#a8c4ff}
.gg{display:block;height:3px;margin-top:1px;background:#0a0f2c}
.gg i{display:block;height:100%;background:#6ee08a}
.gg.mp i{background:#7ab4ff}
#bcmd{min-height:78px}
#bcmd:empty{visibility:hidden}
#bcmd.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:5px}
#bcmd.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));padding:4px 6px}
.gs button{font:inherit;color:#fff;text-shadow:inherit;background:transparent;border:2px solid transparent;border-radius:4px;min-height:0;cursor:pointer}
.gs button:hover,.gs button:focus-visible,#cho button:focus{border-color:var(--glow);background:rgba(255,255,255,.08);outline:none}
.gs button:active{background:rgba(255,232,150,.18)}
.gs button:disabled{opacity:.4;border-color:transparent;background:transparent}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px 5px;font-size:13px}
.tile svg{width:36px;height:36px;filter:drop-shadow(1px 1px 0 #0a0f30)}
.row{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px 7px 24px;min-height:40px;font-size:15px;text-align:left}
.row::before{content:'\25B6';position:absolute;left:7px;font-size:11px;color:var(--glow);opacity:0}
.row:hover::before,.row:focus-visible::before{opacity:1}
.row small{color:#a8c4ff;font-size:12px}
.gs .row.sel,.gs .tile.on,.gs .chip.sel{border-color:var(--glow);background:rgba(255,255,255,.1)}
.row.sel::before,#cho .row:focus::before{opacity:1}
/* the field menu: tabs, a page, and a line about what is picked, over the dimmed picture */
#menu{position:absolute;inset:0;display:flex;flex-direction:column;gap:7px;padding:8px;background:rgba(4,8,22,.5)}
#menu.off{display:none}
.mtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px}
.mtabs .tile svg{width:28px;height:28px}
.mskills .row{min-height:31px;padding-top:3px;padding-bottom:3px}
.mbody{flex:0 1 auto;min-height:0;overflow:auto;padding:5px 6px}
.mbody .row{width:100%}
.mnote{min-height:2.8em;padding:6px 10px;font-size:14px;line-height:1.3}
.mnone{margin:8px 6px;color:#c8d4ff}
.mwho{display:flex;gap:4px;margin-bottom:3px}
.chip{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 2px 2px;font-size:13px}
.face{display:block;width:48px;height:40px;image-rendering:pixelated}
.mstat{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:1px 12px;padding:2px 4px 6px;font-size:12px}
.mstat span{display:flex;justify-content:space-between}
.mstat i{font-style:normal;color:#a8c4ff}
.mskills{border-top:1px solid rgba(160,190,255,.35);padding-top:4px}
@media (prefers-reduced-motion:reduce){#more{animation:none}.cur{animation:none}}
</style>
</head>
<body>
<main id="app">
<header><h1 id="ttl">Brindlebrook</h1><span id="sub"></span></header>
<div id="stage"><canvas id="cv"></canvas>
<div id="ov"></div>
<div id="bparty"></div>
<div id="dlg" class="gs off" role="dialog" aria-live="polite"><div id="cho" class="gs off"></div><div id="who"></div><p id="say"></p><div id="more">&#9660;</div></div>
<div id="menu" class="off" role="dialog" aria-label="Menu"></div>
<div id="fade"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="title" class="off"><p id="tmsg"></p><div id="tbtn"></div></div>
<div id="load" role="status">Preparing&hellip;</div></div>
<p id="hint"></p>
<div id="opts"><button id="rl" aria-label="Turn the view left">&#8630; Turn</button><button id="rr" aria-label="Turn the view right">Turn &#8631;</button><button id="px" class="on" aria-pressed="true">Pixel</button><button id="mn" aria-label="Open the menu">Menu</button></div>
<div id="bp" class="off"><div id="bmsg" class="gs" role="status" aria-live="polite"></div><div id="bcmd" class="gs"></div></div>
<p id="cred">Lighthouse rock and the monsters were sculpted with Ink Studio by Silicon Jungle (MIT licence), then baked to data that this page draws itself.</p>
</main>
<script>
/*BUNDLE*/
</script>
</body>
</html>
